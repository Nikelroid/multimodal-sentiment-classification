# -----------------------------------------------
# Core Multimodal MLOps Configuration
# -----------------------------------------------
# Modifying parameters here will universally sync
# across Dataloaders, Transformers, and Telemetry
# -----------------------------------------------

training:
  batch_size: 32
  learning_rate: 0.00002   # backbone LR (large pretrained encoders want small steps)
  head_lr: 0.0005          # fusion head is trained from scratch
  weight_decay: 0.01
  warmup_ratio: 0.06
  label_smoothing: 0.1
  text_dropout: 0.2
  max_epochs: 8
  patience: 3
  num_workers: 2
  val_split: 0.1
  project_name: "multimodal-sentiment-classification"

model:
  # deberta-v3-large scores marginally higher but its HF repo is .bin-only,
  # which transformers 5.x refuses to load on torch < 2.6 (CVE-2025-32434).
  # roberta-large is safetensors-native and loads everywhere.
  text_model_name: "roberta-large"
  vision_backbone_name: "facebook/dinov2-large"
  audio_model_name: "facebook/wav2vec2-base"
  visualbert_name: "uclanlp/visualbert-nlvr2"
  max_text_len: 50
  use_audio: false
  use_face: true   # face-expression branch (precomputed crops at train, MTCNN at inference)

data:
  dataset_name: "MSCTD"
  # data_dir is structurally managed via CLI or Environment
