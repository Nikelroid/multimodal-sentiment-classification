name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install transformers pillow numpy pyyaml scikit-learn \
                      nltk emoji sentencepiece protobuf pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q
